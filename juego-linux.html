<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Parejas: Distros de Linux</title>
    <style>
        :root {
            --bg-gradient-start: #667eea;
            --bg-gradient-end: #764ba2;
            --card-back-start: #ff6b6b;
            --card-back-end: #4ecdc4;
            --matched-glow: #f9ca24;
            --text-light: #fff;
            --text-dark: #222;
            --grid-size: 4;
            --card: 120px;
            --gap: 15px;
        }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        h1 { text-shadow: 2px 2px 4px rgba(0,0,0,.5); margin: .2em 0; }
        #game-info {
            margin: .5em 0;
            font-size: 1.2em;
            display: flex;
            gap: 1.2em;
            flex-wrap: wrap;
            justify-content: center;
        }
        #game-board {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), var(--card));
            gap: var(--gap);
            margin: 20px 0;
            touch-action: manipulation;
        }
        .card {
            width: var(--card);
            height: var(--card);
            perspective: 1000px;
            cursor: pointer;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform .6s;
            transform-style: preserve-3d;
        }
        .card.flipped .card-inner,
        .card.matched .card-inner { transform: rotateY(180deg); }
        .card.matched {
            animation: pulse .5s ease;
        }
        @keyframes pulse {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        .card-back, .card-front {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-back {
            background: linear-gradient(145deg, var(--card-back-start), var(--card-back-end));
            font-size: 3em;
            font-weight: bold;
        }
        .card-front {
            background: white;
            transform: rotateY(180deg);
        }
        .card-front img {
            width: 80%; height: 80%;
            object-fit: contain;
        }
        /* Accesibilidad: alto contraste y reducción de movimiento */
        @media (prefers-contrast: high) {
            :root { --bg-gradient-start: #000; --bg-gradient-end: #333; }
            .card-back { border: 3px solid var(--text-light); }
        }
        @media (prefers-reduced-motion: reduce) {
            .card-inner { transition: none; }
            .card.matched { animation: none; }
        }
        /* Móviles pequeños: ajustar grid */
        @media (max-width: 520px) {
            :root { --card: 70px; --gap: 10px; }
            #game-board { --grid-size: 4; }
        }
        button {
            background: var(--card-back-start);
            color: var(--text-light);
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            margin: 5px;
        }
        button:hover { background: #ff5252; }
        button:focus-visible { outline: 3px solid var(--matched-glow); }
        #win-message {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            text-align: center;
            display: none;
        }
        #confetti-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <h1>🧠 Juego de Parejas: Distros de Linux 🐧</h1>
    <div id="game-info">
        <span>Movimientos: <strong id="moves">0</strong></span>
        <span>Parejas: <strong id="matches">0</strong>/8</span>
        <span>Tiempo: <strong id="time">00:00</strong></span>
    </div>
    <div id="game-board" role="grid" aria-label="Tablero de cartas"></div>
    <div>
        <button id="new-game">Nuevo juego</button>
        <button id="pause" aria-live="polite">Pausar</button>
    </div>

    <canvas id="confetti-canvas"></canvas>
    <div id="win-message" role="alert">
        <p>¡Felicidades! 🎉</p>
        <p>Has encontrado todas las distros en <span id="final-time"></span> y <span id="final-moves"></span> movimientos.</p>
        <button onclick="resetGame()">Jugar de nuevo</button>
    </div>

    <script>
        /* ---------- CONFIGURACIÓN ---------- */
        const DISTROS = [
            { name: 'MX Linux',      img: 'https://upload.wikimedia.org/wikipedia/commons/2/29/MX_LINUX_Logo.svg' },
            { name: 'Linux Mint',    img: 'https://upload.wikimedia.org/wikipedia/commons/4/45/The_Linux_Mint_Logo.svg' },
            { name: 'Debian',        img: 'https://upload.wikimedia.org/wikipedia/commons/4/4a/Debian-OpenLogo.svg' },
            { name: 'Ubuntu',        img: 'https://upload.wikimedia.org/wikipedia/commons/9/9d/Ubuntu_logo.svg' },
            { name: 'Fedora',        img: 'https://upload.wikimedia.org/wikipedia/commons/8/8f/Fedora_logo_%282021%29.svg' },
            { name: 'Arch Linux',    img: 'https://upload.wikimedia.org/wikipedia/commons/f/f9/Archlinux-logo-standard-version.svg' },
            { name: 'Manjaro',       img: 'https://upload.wikimedia.org/wikipedia/commons/3/3e/Manjaro-logo.svg' },
            { name: 'Kali Linux',    img: 'https://upload.wikimedia.org/wikipedia/commons/2/2b/Kali-dragon-icon.svg' }
        ];
        const TOTAL_PAIRS = DISTROS.length;
        const FLIP_WAIT    = 800; // ms

        /* ---------- ESTADO ---------- */
        let cards, flipped, matched, moves, timer, seconds, paused, boardLocked;

        /* ---------- ELEMENTOS ---------- */
        const board      = document.getElementById('game-board');
        const movesEl    = document.getElementById('moves');
        const matchesEl  = document.getElementById('matches');
        const timeEl     = document.getElementById('time');
        const winEl      = document.getElementById('win-message');
        const canvas     = document.getElementById('confetti-canvas');
        const ctx        = canvas.getContext('2d');
        const newBtn     = document.getElementById('new-game');
        const pauseBtn   = document.getElementById('pause');

        /* ---------- INICIALIZAR ---------- */
        function init() {
            preloadImages([...DISTROS, ...DISTROS].map(d=>d.img));
            resetGame();
            newBtn.addEventListener('click', resetGame);
            pauseBtn.addEventListener('click', togglePause);
            board.addEventListener('click', handleBoardClick);
            board.addEventListener('keydown', handleBoardKey);
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }
        init();

        function resetGame() {
            cards       = shuffle([...DISTROS, ...DISTROS]);
            flipped     = [];
            matched     = 0;
            moves       = 0;
            seconds     = 0;
            paused      = false;
            boardLocked = false;
            winEl.style.display = 'none';
            renderBoard();
            updateInfo();
            clearInterval(timer);
            timer = setInterval(updateTimer, 1000);
            pauseBtn.textContent = 'Pausar';
        }

        /* ---------- RENDER ---------- */
        function renderBoard() {
            board.innerHTML = '';
            cards.forEach((distro, idx) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = idx;
                card.setAttribute('role', 'gridcell');
                card.setAttribute('aria-label', 'Carta');
                card.setAttribute('tabindex', 0);
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-back">?</div>
                        <div class="card-front">
                            <img src="${distro.img}" alt="${distro.name}">
                        </div>
                    </div>`;
                board.appendChild(card);
            });
        }

        /* ---------- EVENTOS ---------- */
        function handleBoardClick(e) {
            const card = e.target.closest('.card');
            if (!card || boardLocked) return;
            flip(card);
        }
        function handleBoardKey(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                const card = e.target.closest('.card');
                if (card) flip(card);
            }
        }
        function flip(card) {
            if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
            card.classList.add('flipped');
            flipped.push(card);
            if (flipped.length === 2) {
                boardLocked = true;
                moves++;
                updateInfo();
                setTimeout(checkMatch, FLIP_WAIT);
            }
        }
        function checkMatch() {
            const [a, b] = flipped;
            const match = a.querySelector('img').src === b.querySelector('img').src;
            if (match) {
                a.classList.add('matched');
                b.classList.add('matched');
                matched++;
                updateInfo();
                if (matched === TOTAL_PAIRS) setTimeout(showWin, 300);
            } else {
                a.classList.remove('flipped');
                b.classList.remove('flipped');
            }
            flipped = [];
            boardLocked = false;
        }

        /* ---------- UI ---------- */
        function updateInfo() {
            movesEl.textContent   = moves;
            matchesEl.textContent = matched;
        }
        function updateTimer() {
            if (paused) return;
            seconds++;
            const m = String(Math.floor(seconds / 60)).padStart(2,'0');
            const s = String(seconds % 60).padStart(2,'0');
            timeEl.textContent = `${m}:${s}`;
        }
        function togglePause() {
            paused = !paused;
            pauseBtn.textContent = paused ? 'Reanudar' : 'Pausar';
            board.style.visibility = paused ? 'hidden' : 'visible';
        }
        function showWin() {
            clearInterval(timer);
            document.getElementById('final-moves').textContent = moves;
            document.getElementById('final-time').textContent  = timeEl.textContent;
            winEl.style.display = 'flex';
            launchConfetti();
        }

        /* ---------- CONFETI ---------- */
        let confettiRunning = false;
        function launchConfetti() {
            if (confettiRunning) return;
            confettiRunning = true;
            const colors = ['#ff6b6b','#4ecdc4','#45b7d1','#f9ca24','#f0932b','#eb4d4b'];
            const pieces = [];
            for (let i = 0; i < 250; i++) {
                pieces.push({
                    x: rand(0, canvas.width),
                    y: rand(-canvas.height, 0),
                    vx: rand(-4, 4),
                    vy: rand(2, 6),
                    size: rand(4, 8),
                    color: colors[rand(0, colors.length - 1)],
                    angle: rand(0, 360),
                    speed: rand(-6, 6)
                });
            }
            let frame;
            (function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;
                for (const p of pieces) {
                    p.y += p.vy; p.x += p.vx; p.angle += p.speed;
                    if (p.y < canvas.height) alive = true;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.angle * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                }
                if (alive) frame = requestAnimationFrame(animate);
                else { cancelAnimationFrame(frame); confettiRunning = false; }
            })();
        }

        /* ---------- HELPERS ---------- */
        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        function preloadImages(urls) {
            urls.forEach(u => { const i=new Image(); i.src=u; });
        }
        function resizeCanvas() {
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    </script>
</body>
</html>
